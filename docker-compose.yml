services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER:-jobqueue}
      POSTGRES_PASSWORD: ${DB_PASS:-jobqueue}
      POSTGRES_DB: ${DB_NAME:-jobqueue}
    ports:
      - "127.0.0.1:15432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql
  migrate:
    build: .
    command: ["node", "dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://${DB_USER:-jobqueue}:${DB_PASS:-jobqueue}@postgres:5432/${DB_NAME:-jobqueue}
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgres://${DB_USER:-jobqueue}:${DB_PASS:-jobqueue}@postgres:5432/${DB_NAME:-jobqueue}
      PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  postgres_data:
